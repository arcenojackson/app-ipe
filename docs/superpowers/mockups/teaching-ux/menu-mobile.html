<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu mobile — hambúrguer</title>
<style>
:root{--bg:#0b0f19;--surface:#111828;--elev:#1b2435;--primary:#2f4f2f;--sec:#6b8e23;--on:#fff;
--muted:rgba(255,255,255,.62);--line:rgba(255,255,255,.08)}
*{box-sizing:border-box}body{margin:0;background:#06090f;color:var(--on);font:14px/1.45 system-ui,-apple-system,sans-serif}
.stage{display:flex;flex-wrap:wrap;gap:32px;justify-content:center;padding:24px}
figure{margin:0}figcaption{text-align:center;color:var(--muted);margin-bottom:10px;max-width:375px}
.phone{position:relative;width:375px;height:700px;background:var(--bg);border-radius:28px;overflow:hidden;border:1px solid var(--line)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.bar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.burger{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--elev)}
.burger svg,.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.brand{font-weight:700;display:flex;align-items:center;gap:8px}
.logo{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--sec))}
.content{padding:20px 16px}.content h1{font-size:20px;margin:0 0 8px}
.card{background:var(--surface);border-radius:18px;padding:14px;margin-top:12px;color:var(--muted)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:absolute;top:0;bottom:0;left:0;width:280px;max-width:85%;background:var(--surface);padding:16px;display:flex;flex-direction:column;
transform:translateX(-100%);transition:transform .22s ease;box-shadow:8px 0 24px rgba(0,0,0,.4)}
.open .scrim{opacity:1;pointer-events:auto}.open .drawer{transform:none}
.dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.x{width:40px;height:40px;border-radius:14px;font-size:18px;color:var(--muted)}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 12px 4px;margin:0}
.nav{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;color:var(--muted)}
.nav.on{background:rgba(107,142,35,.2);color:#fff;font-weight:600}
.who{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;color:var(--muted)}
.who b{display:block;color:var(--on);font-weight:400;margin-bottom:4px}.who button{color:var(--sec);padding:6px 0}
</style>
</head>
<body>
<div class="stage">
  <figure><figcaption>Menu fechado: só uma barra no topo, o conteúdo começa logo abaixo</figcaption><div class="phone" id="a"></div></figure>
  <figure><figcaption>Menu aberto (interativo: ☰ abre; tocar fora, ✕ ou Esc fecha). Em desktop nada muda.</figcaption><div class="phone open" id="b"></div></figure>
</div>
<template id="tpl">
  <div class="bar">
    <button class="burger" aria-label="Abrir menu" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="brand"><span class="logo"></span>Portal de Ensino</span>
  </div>
  <div class="content">
    <h1>Eleição ELO</h1>
    <div class="card">O conteúdo começa logo abaixo da barra.</div>
    <div class="card">Sem o menu empurrando a página.</div>
  </div>
  <div class="scrim"></div>
  <aside class="drawer" aria-label="Menu">
    <div class="dhead"><span class="brand"><span class="logo"></span>Portal de Ensino</span><button class="x" aria-label="Fechar menu">✕</button></div>
    <p class="grp">Ensino</p>
    <a class="nav on"><svg viewBox="0 0 24 24"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.5 5.5l3.8-1 3.2 14.5-3.8 1z"/></svg>Biblioteca</a>
    <a class="nav"><svg viewBox="0 0 24 24"><path d="M5 3h14a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Zm3 5h8M8 12h8M8 16h5"/></svg>Plano pedagógico</a>
    <a class="nav"><svg viewBox="0 0 24 24"><path d="M12 16V4m0 0 4 4m-4-4L8 8M4 14v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/></svg>Fila de revisão</a>
    <a class="nav"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.7 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg>Fórum</a>
    <div class="who"><b>Jackson Felipe</b><button>Sair</button></div>
  </aside>
</template>
<script>
const tpl=document.getElementById('tpl');
for(const id of ['a','b']){
  const p=document.getElementById(id);p.append(tpl.content.cloneNode(true));
  const set=o=>{p.classList.toggle('open',o);p.querySelector('.burger').setAttribute('aria-expanded',o)};
  p.querySelector('.burger').onclick=()=>set(true);
  p.querySelector('.x').onclick=p.querySelector('.scrim').onclick=()=>set(false);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')set(false)});
}
</script>
</body>
</html>
