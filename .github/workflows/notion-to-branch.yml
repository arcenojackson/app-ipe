name: Notion → GitHub Branch

on:
  # Disparo manual pelo GitHub Actions UI
  workflow_dispatch:
  # Polling a cada 2 horas (ajuste conforme necessidade)
  schedule:
    - cron: '0 */2 * * *'

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync Notion tasks → GitHub branches
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          NOTION_STATUS_FIELD: ${{ vars.NOTION_STATUS_FIELD }}
          NOTION_STATUS_VALUE: ${{ vars.NOTION_STATUS_VALUE }}
          NOTION_BRANCH_FIELD: ${{ vars.NOTION_BRANCH_FIELD }}
          GH_TOKEN: ${{ secrets.PAT }}
          REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ vars.BASE_BRANCH || 'main' }}
        run: |
          cat << 'EOF' > sync.cjs
          const https = require('https');
          const { execSync } = require('child_process');

          const NOTION_TOKEN      = process.env.NOTION_TOKEN;
          const DATABASE_ID       = process.env.NOTION_DATABASE_ID;
          const STATUS_FIELD      = process.env.NOTION_STATUS_FIELD  || 'Status';
          const STATUS_VALUE      = process.env.NOTION_STATUS_VALUE  || 'Em andamento';
          const BRANCH_FIELD      = process.env.NOTION_BRANCH_FIELD  || 'Branch';
          const BASE_BRANCH       = process.env.BASE_BRANCH          || 'main';

          // ── Helpers ────────────────────────────────────────────────
          function notionRequest(method, path, body) {
            return new Promise((resolve, reject) => {
              const data = body ? JSON.stringify(body) : '';
              const req = https.request({
                hostname: 'api.notion.com',
                path,
                method,
                headers: {
                  'Authorization': `Bearer ${NOTION_TOKEN}`,
                  'Notion-Version': '2022-06-28',
                  'Content-Type': 'application/json',
                  ...(data && { 'Content-Length': Buffer.byteLength(data) })
                }
              }, res => {
                let raw = '';
                res.on('data', d => raw += d);
                res.on('end', () => {
                  try { resolve(JSON.parse(raw)); }
                  catch { resolve({}); }
                });
              });
              req.on('error', reject);
              if (data) req.write(data);
              req.end();
            });
          }

          // Converte título em nome de branch: remove acentos, kebab-case, max 60 chars
          function toBranchName(title, type = 'feat') {
            const clean = title
              .normalize('NFD').replace(/[\u0300-\u036f]/g, '')  // remove acentos
              .toLowerCase()
              .replace(/[^a-z0-9\s-]/g, '')                      // remove especiais
              .trim()
              .replace(/\s+/g, '-')                              // espaços → hífens
              .replace(/-+/g, '-')                               // hífens duplos
              .slice(0, 55);                                     // limite de chars
            return `${type}/${clean}`;
          }

          // Detecta prefixo pelo título da task
          function detectType(title) {
            const t = title.toLowerCase();
            if (t.startsWith('fix') || t.startsWith('bug') || t.startsWith('corrig')) return 'fix';
            if (t.startsWith('doc') || t.startsWith('readme')) return 'docs';
            if (t.startsWith('chore') || t.startsWith('config') || t.startsWith('dep')) return 'chore';
            if (t.startsWith('refactor') || t.startsWith('refatorar')) return 'refactor';
            return 'feat';
          }

          // ── Main ───────────────────────────────────────────────────
          async function main() {
            console.log(`🔍 Buscando tasks com status "${STATUS_VALUE}" no Notion...`);

            // Busca tasks com o status configurado
            const res = await notionRequest('POST', `/v1/databases/${DATABASE_ID}/query`, {
              filter: {
                property: STATUS_FIELD,
                status: { equals: STATUS_VALUE }
              }
            });

            if (!res.results || res.results.length === 0) {
              console.log('Nenhuma task encontrada com esse status.');
              return;
            }

            console.log(`Encontradas ${res.results.length} task(s).`);

            // Busca branches existentes no repo
            const existingBranches = execSync('git branch -r').toString()
              .split('\n').map(b => b.trim().replace('origin/', ''));

            for (const page of res.results) {
              const titleProp = Object.values(page.properties).find(
                p => p.type === 'title'
              );
              if (!titleProp || !titleProp.title.length) continue;

              const taskTitle = titleProp.title.map(t => t.plain_text).join('');

              // Verifica se já existe campo Branch preenchido
              const branchProp = page.properties[BRANCH_FIELD];
              const existingBranch = branchProp?.rich_text?.[0]?.plain_text || '';

              if (existingBranch) {
                console.log(`⏭️  Pulando "${taskTitle}" — branch já existe: ${existingBranch}`);
                continue;
              }

              const type = detectType(taskTitle);
              const branchName = toBranchName(taskTitle, type);

              // Verifica se a branch já existe no GitHub
              if (existingBranches.includes(branchName)) {
                console.log(`⚠️  Branch já existe no GitHub: ${branchName} — atualizando Notion...`);
              } else {
                // Cria a branch no GitHub
                try {
                  execSync(`git checkout ${BASE_BRANCH}`);
                  execSync(`git pull origin ${BASE_BRANCH}`);
                  execSync(`git checkout -b ${branchName}`);
                  execSync(`git push origin ${branchName}`);
                  console.log(`✅ Branch criada: ${branchName}`);
                } catch (e) {
                  console.error(`❌ Erro ao criar branch "${branchName}":`, e.message);
                  continue;
                }
              }

              // Atualiza o campo Branch no card do Notion
              await notionRequest('PATCH', `/v1/pages/${page.id}`, {
                properties: {
                  [BRANCH_FIELD]: {
                    rich_text: [{ type: 'text', text: { content: branchName } }]
                  }
                }
              });

              console.log(`📝 Notion atualizado: "${taskTitle}" → ${branchName}`);
            }

            console.log('✅ Sincronização concluída.');
          }

          main().catch(e => {
            console.error('Erro fatal:', e);
            process.exit(1);
          });
          EOF
          node sync.cjs
