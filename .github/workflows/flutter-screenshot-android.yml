name: Flutter Screenshot (Android)

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Toda segunda-feira às 9h (horário de Brasília = 12h UTC)
    - cron: '0 12 * * 1'

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
            /usr/local/share/boost /opt/ghc /usr/local/share/chromium \
            /usr/local/lib/android/sdk/build-tools/33.0.* \
            /usr/local/lib/android/sdk/build-tools/34.0.* \
            /usr/local/lib/android/sdk/platforms/android-34
          sudo apt-get clean
          df -h

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create app_secrets.dart from example
        run: cp lib/src/core/config/app_secrets.dart.example lib/src/core/config/app_secrets.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug

      # ── Sobe emulador Android e captura screenshot ──────────────────
      - name: Run emulator + capture screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_6
          avd-name: arclabz_avd
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            echo "⏳ Aguardando emulador estabilizar..."
            adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 2; done'
            sleep 5

            echo "📦 Instalando APK..."
            adb install -r build/app/outputs/flutter-apk/app-debug.apk

            echo "🚀 Iniciando app..."
            # Substitua pelo package real do app (configurado via Variable)
            adb shell monkey -p $APP_PACKAGE -c android.intent.category.LAUNCHER 1

            echo "⏳ Aguardando app carregar..."
            sleep 10

            echo "📸 Capturando screenshot da tela principal..."
            adb exec-out screencap -p > screenshot-home.png

            # Opcional: navegar para outras telas e capturar mais screenshots
            # Descomente e adapte conforme as rotas do seu app
            #
            # adb shell input tap 540 1200   # simula tap em um botão
            # sleep 3
            # adb exec-out screencap -p > screenshot-tela2.png
        env:
          APP_PACKAGE: ${{ vars.APP_PACKAGE }}

      # ── Upload dos screenshots como artefato ────────────────────────
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-android-${{ vars.PROJECT_NAME }}-${{ github.run_number }}
          path: screenshot-*.png
          retention-days: 30

      # ── Atualiza o Notion (opcional) ────────────────────────────────
      - name: Update Notion
        if: ${{ env.NOTION_TOKEN != '' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e "
          const https = require('https');
          const now = new Date().toISOString().slice(0,16).replace('T',' ');
          const body = JSON.stringify({
            parent: { page_id: process.env.NOTION_PAGE_ID },
            rich_text: [{
              type: 'text',
              text: {
                content: '📱 Screenshot Android gerado em ' + now + ' UTC\n' +
                         'Projeto: ' + process.env.PROJECT_NAME + '\n' +
                         'Action: ' + process.env.RUN_URL
              }
            }]
          });
          const req = https.request({
            hostname: 'api.notion.com', path: '/v1/comments', method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + process.env.NOTION_TOKEN,
              'Notion-Version': '2022-06-28',
              'Content-Type': 'application/json',
              'Content-Length': Buffer.byteLength(body)
            }
          }, res => {
            let d = '';
            res.on('data', c => d += c);
            res.on('end', () => console.log('✅ Notion atualizado'));
          });
          req.on('error', e => console.error('Erro Notion:', e.message));
          req.write(body);
          req.end();
          "
